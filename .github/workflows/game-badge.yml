name: Update game badge

on:
  push:
    branches:
      - main
    paths:
      - "src/packs/**/manifest.js"
      - "src/packs/registry.js"
      - "datasets/**"
      - ".github/workflows/game-badge.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Generate community packs
        run: npm run generate:community-packs

      - name: Compute game count
        run: node scripts/count-games.js

      - name: Update last-modified fields
        run: node scripts/update-versions.js

      - name: Commit changes and create PR
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update game count and last-modified fields"
          branch: badge-update
          base: main
          title: "Update game badge and counts"
          body: "Automated update of badge.json and manifest last-modified fields."
          committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          labels: automated, badge
