<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect x="1" y="1" width="22" height="22" rx="3" fill="#ede9fe"/>

  <!-- Base 2x2 grid -->
  <rect x="4" y="4" width="8" height="8" fill="#c4b5fd" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="12" y="4" width="8" height="8" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="4" y="12" width="8" height="8" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="12" y="12" width="8" height="8" fill="#c4b5fd" stroke="#8b5cf6" stroke-width="2"/>

  <!-- Operation symbols -->
  <text x="8"  y="10.5" font-family="Arial" font-size="8" font-weight="bold" fill="#7c3aed" text-anchor="middle">×</text>
  <text x="16" y="10.5" font-family="Arial" font-size="8" font-weight="bold" fill="#7c3aed" text-anchor="middle">+</text>
  <text x="8"  y="18.5" font-family="Arial" font-size="8" font-weight="bold" fill="#7c3aed" text-anchor="middle">÷</text>
  <text x="16" y="18.5" font-family="Arial" font-size="8" font-weight="bold" fill="#7c3aed" text-anchor="middle">−</text>

</svg>
